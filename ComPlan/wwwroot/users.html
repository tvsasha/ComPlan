<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ComPlan: Пользователи</title>
<style>
/* Возвращаем старый красивый дизайн карточек */
body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #74ebd5, #ACB6E5); margin:0; padding:0; min-height:100vh;}
h1 { text-align:center; margin:20px 0; color:#333;}
#usersList { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; list-style:none; padding:0;}
.user-card { background:#fff; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.15); padding:20px; width:220px; text-align:center; position:relative;}
.user-name { font-size:1.2rem; font-weight:600; margin-bottom:10px;}
.role-name { font-size:1rem; color:#777; background:#f0f0f0; padding:5px 10px; border-radius:12px;}
button { margin-top:10px; padding:5px 10px; border:none; border-radius:8px; cursor:pointer;}
.edit-btn { background:#4A90E2; color:#fff; }
.delete-btn { background:#E94E77; color:#fff; }
.create-btn { background:#50C878; color:#fff; margin:20px; }
</style>
</head>
<body>
<div id="authBlock">
    <h2>Вход</h2>
    <input id="loginUser" placeholder="Имя пользователя">
    <input id="loginPass" type="password" placeholder="Пароль">
    <button id="loginBtn">Войти</button>
    <p id="loginError" style="color:red;"></p>

    <h2>Регистрация</h2>
    <input id="regUser" placeholder="Имя пользователя">
    <input id="regPass" type="password" placeholder="Пароль">
    <select id="regRole"></select>
    <button id="regBtn">Зарегистрироваться</button>
    <p id="regError" style="color:red;"></p>
</div>

<ul id="usersList" style="display:none;"></ul>
<script>
const apiUrl = "http://localhost:5150/api";
let currentUser = null;

async function loadRoles() {
    const res = await fetch(`${apiUrl}/roles`);
    const roles = await res.json();
    const select = document.getElementById("regRole");
    roles.forEach(r => {
        const option = document.createElement("option");
        option.value = r.roleId;
        option.textContent = r.roleName;
        select.appendChild(option);
    });
}

document.getElementById("loginBtn").addEventListener("click", async () => {
    const userName = document.getElementById("loginUser").value;
    const password = document.getElementById("loginPass").value;
    const res = await fetch(`${apiUrl}/auth/login`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ userName, password })
    });
    const data = await res.json();
	if (res.ok) {
		currentUser = data;
		document.getElementById("authBlock").style.display = "none";
		document.getElementById("usersList").style.display = "flex";
		loadUsers();
	} else {
		document.getElementById("loginError").textContent = data.message || JSON.stringify(data);
	}

});

document.getElementById("regBtn").addEventListener("click", async () => {
    const userName = document.getElementById("regUser").value;
    const password = document.getElementById("regPass").value;
    const roleId = parseInt(document.getElementById("regRole").value);
    const res = await fetch(`${apiUrl}/auth/register`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ userName, password, roleId })
    });
    const data = await res.json();
    if (res.ok) {
        alert(data.message);
    } else {
        document.getElementById("regError").textContent = data.message;
    }
});

async function loadUsers() {
    const res = await fetch(`${apiUrl}/users`);
    const users = await res.json();
    const list = document.getElementById("usersList");
    list.innerHTML = "";
    users.forEach(u => {
        const li = document.createElement("li");
        li.className = "user-card";
        li.textContent = `${u.userName} (${u.role.roleName})`;
        li.dataset.userId = u.userId;
        list.appendChild(li);

        li.addEventListener("contextmenu", e => {
            e.preventDefault();
            const newName = prompt("Новое имя:");
            if (newName) {
                fetch(`${apiUrl}/users/${u.userId}`, {
                    method: "PUT",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ userName: newName })
                }).then(loadUsers);
            }
        });

        li.addEventListener("dblclick", () => {
            if(confirm("Удалить пользователя?")) {
                fetch(`${apiUrl}/users/${u.userId}`, { method: "DELETE" })
                .then(loadUsers);
            }
        });
    });
}

loadRoles();
</script>
</body>
</html>
